name: Bug report
description: Something does not work as the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not file it here. Use **Security, Report a vulnerability** instead.

        Please do not paste chat logs, workspace files, API keys or your own `claude_desktop_config.json`. Cut logs down to the lines that show the problem.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Which part
      options:
        - the_forge or a plugin in Hot_Plugins
        - readonly_bridge
        - The_Observer
        - search (x9_search, indexer)
        - setup or docs
        - not sure
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: From `%APPDATA%\Claude\logs\mcp-server-<name>.log`. Remove paths or names you do not want to share.
      render: text
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: node
    attributes:
      label: Node.js version (node -v)
  - type: input
    id: claude
    attributes:
      label: Claude Desktop version
