name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies from the lockfiles
        run: npm run install:all
      - name: Run tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies from the lockfiles
        run: npm run install:all
      - name: Known vulnerabilities
        run: npm run audit:all
      - name: Registry signatures
        run: |
          npm audit signatures --prefix the_forge
          npm audit signatures --prefix readonly_bridge
          npm audit signatures --prefix The_Observer
