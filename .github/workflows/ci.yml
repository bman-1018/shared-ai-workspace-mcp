name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The current LTS lines: 24 (active) and 22 (maintenance). Node 20 reached end of life in April 2026.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies from the lockfiles
        run: npm run install:all
      # numpy only: the semantic search tests use a stand-in embedder, so no model download.
      - name: Install numpy for the semantic search tests
        run: "python -m pip install --only-binary=:all: numpy==2.5.3"
      - name: Run tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies from the lockfiles
        run: npm run install:all
      - name: Known vulnerabilities
        run: npm run audit:all
      - name: Registry signatures
        run: |
          npm audit signatures --prefix the_forge
          npm audit signatures --prefix readonly_bridge
          npm audit signatures --prefix The_Observer
